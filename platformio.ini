; Pico Paint — PlatformIO project configuration
;
; Board: Raspberry Pi Pico 2 W (RP2350, 4 MB flash)
; Display: 4" ILI9488 480x320 SPI (portrait 320x480) + HR2046/XPT2046 touch
;
; The official platformio/raspberrypi platform only ships RP2040 boards.
; The maxgerhardt fork below adds RP2350 / Pico 2 W support. Pinned to a commit
; for reproducible builds.

[platformio]
default_envs = pico2w_usb

[env:pico2w_usb]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2w
framework = arduino
monitor_speed = 115200

; 4 MB flash: ~2 MB sketch + 2 MB LittleFS. The filesystem is also used by
; ArduinoOTA to stage firmware updates, so it must not be filled by the gallery.
board_build.filesystem_size = 2m

build_flags =
  -DPAINT_BOARD_PICO2W=1

; USB upload (first flash and recovery)
upload_protocol = picotool

[env:pico2w_ota]
extends = env:pico2w_usb
; Usage:
;   export PAINT_OTA_IP=192.168.1.42
;   export PAINT_OTA_PASSWORD='...'
;   pio run -e pico2w_ota -t upload
; On WSL2, use tools/ota_windows.sh instead: the Pico cannot reach a TCP
; listener inside WSL through the Windows LAN address.
upload_protocol = espota
upload_port = ${sysenv.PAINT_OTA_IP}
; PlatformIO already passes "-p 2040" to espota.py, and it forwards the whole
; upload_flags value as a single argument. Keep this to exactly one flag.
upload_flags = --auth=${sysenv.PAINT_OTA_PASSWORD}

[env:pico2w_diag]
extends = env:pico2w_usb
build_flags = ${env:pico2w_usb.build_flags} -DPAINT_DIAG=1

[env:native]
platform = native
test_framework = unity
; The UI-flow tests link against the real immediate-mode UI, graphics
; primitives and font. Keep Arduino-dependent sources (main.cpp, display
; driver, touch driver, storage) out of the host build.
test_build_src = yes
build_src_filter =
  +<ui/ui.cpp>
  +<display/gfx.cpp>
  +<ui/font5x7.cpp>
  +<paint/codec_rle.cpp>
  +<paint/pnt.cpp>
  +<storage/paint_names.cpp>
build_flags = -std=gnu++17
